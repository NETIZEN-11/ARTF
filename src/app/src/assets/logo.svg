<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
     viewBox="0 0 200 200" xml:space="preserve">
<style type="text/css">
    .st0{fill:#FF4444;}
    .st1{fill:#CC0000;}
    .st2{fill:#FFFFFF;}
    .st3{fill:#333333;}
</style>
<!-- Shield background -->
<path class="st0" d="M100,20 L170,50 L170,110 Q170,150 100,180 Q30,150 30,110 L30,50 Z"/>
<path class="st1" d="M100,25 L165,52 L165,110 Q165,148 100,175 Q35,148 35,110 L35,52 Z"/>

<!-- Letters ARTEF -->
<g class="st2">
  <!-- A -->
  <path d="M50,140 L60,100 L70,140 M53,130 L67,130"/>
  <!-- R -->
  <path d="M80,100 L80,140 M80,100 L95,100 Q100,100 100,110 Q100,120 95,120 L80,120 M85,120 L100,140"/>
  <!-- T -->
  <path d="M110,100 L130,100 M120,100 L120,140"/>
  <!-- E -->
  <path d="M140,100 L140,140 M140,100 L158,100 M140,120 L155,120 M140,140 L158,140"/>
  <!-- F -->
  <path d="M168,100 L168,140 M168,100 L185,100 M168,120 L180,120"/>
</g>

<!-- Security scan lines -->
<g class="st3" opacity="0.3">
  <line x1="30" y1="70" x2="170" y2="70" stroke-width="2"/>
  <line x1="30" y1="85" x2="170" y2="85" stroke-width="2"/>
  <line x1="30" y1="155" x2="170" y2="155" stroke-width="2"/>
</g>

<!-- Red team target symbol -->
<circle class="st0" cx="100" cy="60" r="8" fill="none" stroke="#FF4444" stroke-width="2"/>
<circle class="st0" cx="100" cy="60" r="4" fill="none" stroke="#FF4444" stroke-width="2"/>
<circle class="st0" cx="100" cy="60" r="1.5" fill="#FF4444"/>

</svg>